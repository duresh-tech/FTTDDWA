# ---------------------------------------------------------------------------
# Shared proxy settings, included by every location that forwards upstream.
# Plain config, not a template: the timeouts are set at server level in
# templates/default.conf.template and inherited here.
# ---------------------------------------------------------------------------

# HTTP/1.1 with an empty Connection header lets the upstream `keepalive` pools
# reuse connections.
proxy_http_version 1.1;
proxy_set_header Connection "";

# $host, not $http_host: the browser's hostname without its port. The site
# resolver reads it to decide whether a request is on a tenant business
# domain, and it compares against hostnames stored without ports.
proxy_set_header Host      $host;
proxy_set_header X-Real-IP $remote_addr;

# SET, not append.
#
# $remote_addr is already the real client - set_real_ip_from in the template
# rewrites it from the edge's X-Forwarded-For when the edge is running - so
# setting the header carries exactly ONE address in both modes. That is what
# makes a single TRUST_PROXY=1 correct whether or not the edge profile is up.
#
# Appending with $proxy_add_x_forwarded_for would yield "<client>, <caddy>" in
# edge mode and "<client>" without it, so the hop count would differ and
# Express would resolve the Caddy address as the client - silently breaking
# per-client rate limiting.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

proxy_set_header X-Request-ID $request_id;
add_header X-Request-ID $request_id always;

# The root filesystem is read-only, so a large response (a customer CSV
# export) must never spill to a temp file.
proxy_buffering on;
proxy_max_temp_file_size 0;
