org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# OFF because the project and the pub cache are on different Windows drives.
#
# Kotlin's incremental cache is "relocatable": it stores every source path
# RELATIVE to the project root. A plugin compiled out of C:\Users\...\Pub\Cache
# has no relative path to a project on D:, so the converter throws
# "different roots" and the build fails while CLOSING the caches -- which
# surfaces as "Could not close incremental caches" and names no drive.
#
# It costs a Kotlin recompile of the plugins per clean build and nothing on a
# Dart change. The alternative is moving PUB_CACHE onto the project drive,
# which is a machine-wide change for one project.
kotlin.incremental=false
